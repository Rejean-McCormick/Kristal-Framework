site_name: Kristal Framework v5
site_description: Deterministic, portable epistemic artifact framework and normative contract set
site_author: Réjean McCormick

docs_dir: docs

validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

not_in_nav: |
  Technical-Reference/kristal-docs-v5/02-schemas/*.json
  Technical-Reference/kristal-docs-v5/09-test-vectors/**/*.json
  Technical-Reference/kristal-docs-v5/09-test-vectors/**/*.txt
  Technical-Reference/kristal-docs-v5/10-examples/*.json

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details

plugins:
  - search

nav:
  - Home: index.md
  - Status:
      - v5.0.0-rc.2 candidate status: status/2026-09-16-v5.0.0-rc.2-candidate.md
      - Current validation status: status/2026-09-16-v5-validation-status.md
      - v5 conformance suite status: status/2026-09-16-v5-conformance-suite.md
      - Historical v5.0.0-rc.1 release status: status/2026-09-14-v5.0.0-rc.1.md
  - Overview:
      - Specification status: Technical-Reference/kristal-docs-v5/00-overview/specification-status.md
      - What is Kristal v5: Technical-Reference/kristal-docs-v5/00-overview/what-is-kristal-v5.md
      - Vision and scope: Technical-Reference/kristal-docs-v5/00-overview/vision-and-scope.md
      - Validation, certainty and authority: Technical-Reference/kristal-docs-v5/00-overview/validation-certainty-and-authority.md
      - Plural validation and federated authority: Technical-Reference/kristal-docs-v5/00-overview/plural-validation-and-federated-authority.md
      - Sharding and federation: Technical-Reference/kristal-docs-v5/00-overview/sharding-and-federation.md
      - Ecosystem integration: Technical-Reference/kristal-docs-v5/00-overview/ecosystem-integration.md
      - Conformance and alignment: Technical-Reference/kristal-docs-v5/00-overview/conformance-and-alignment.md
  - Core specification:
      - Core spec: Technical-Reference/kristal-docs-v5/01-core-spec/kristal-v5-core-spec.md
      - Structured Epistemic State: Technical-Reference/kristal-docs-v5/01-core-spec/structured-epistemic-state.md
      - Assertion status and certainty: Technical-Reference/kristal-docs-v5/01-core-spec/assertion-status-and-certainty.md
      - Authority recognition: Technical-Reference/kristal-docs-v5/01-core-spec/authority-recognition.md
      - IDs, canonicalization and hashing: Technical-Reference/kristal-docs-v5/01-core-spec/ids-canonicalization-hashing.md
      - Signatures and trust: Technical-Reference/kristal-docs-v5/01-core-spec/signatures-trust.md
  - Reproducibility:
