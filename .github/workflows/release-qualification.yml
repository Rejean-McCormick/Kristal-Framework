name: Kristal Release Reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  release:
    name: Deterministic v9 release archive
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Kristal Framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Re-run normative validation
        run: python tools/validate_all.py

      - name: Confirm committed repository manifest is current
        run: |
          cp REPO_MANIFEST.json "$RUNNER_TEMP/manifest.before.json"
          python tools/build_release.py
          cmp "$RUNNER_TEMP/manifest.before.json" REPO_MANIFEST.json

      - name: First release build
        run: |
          cp "../kristal-$(cat VERSION).zip" "$RUNNER_TEMP/release-a.zip"
          sha256sum "$RUNNER_TEMP/release-a.zip" | tee "$RUNNER_TEMP/release-a.sha256"

      - name: Second independent release build
        run: |
          rm -f "../kristal-$(cat VERSION).zip"
          python tools/build_release.py
          cp "../kristal-$(cat VERSION).zip" "$RUNNER_TEMP/release-b.zip"
          sha256sum "$RUNNER_TEMP/release-b.zip" | tee "$RUNNER_TEMP/release-b.sha256"

      - name: Require byte-identical release archives
        run: cmp "$RUNNER_TEMP/release-a.zip" "$RUNNER_TEMP/release-b.zip"

      - name: Prepare release evidence
        run: |
          mkdir -p ci-evidence
          cp "$RUNNER_TEMP/release-a.sha256" ci-evidence/
          cp "$RUNNER_TEMP/release-b.sha256" ci-evidence/
          cp REPO_MANIFEST.json ci-evidence/
          {
            echo "repository=${{ github.repository }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "version=$(cat VERSION)"
          } > ci-evidence/subject.txt

      - name: Upload deterministic release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kristal-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ../kristal-*.zip
            ci-evidence/
