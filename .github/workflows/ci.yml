name: Kristal Standard CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kristal-standard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  native-conformance:
    name: Native v9 standard conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Kristal Framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Record validation subject
        run: |
          mkdir -p ci-evidence
          {
            echo "repository=${{ github.repository }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "version=$(cat VERSION)"
            echo "runner=${{ runner.os }}/${{ runner.arch }}"
            python --version
            node --version
            npm --version
          } | tee ci-evidence/subject.txt

      - name: Run normative repository validation
        run: |
          set -o pipefail
          python tools/validate_all.py 2>&1 | tee ci-evidence/validate-all.txt

      - name: Ensure validation did not mutate tracked source
        run: git diff --exit-code

      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kristal-native-v9-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ci-evidence/
