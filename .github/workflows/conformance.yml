name: Kristal conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check generated manifests
        run: python tools/build_manifests.py --check
      - name: Validate Kristal release contracts
        run: python tools/validate_release.py
      - name: Build documentation strictly
        run: mkdocs build --strict
